name: Build Cloud & Deploy Local

on:
  push:
    branches:
      - main

jobs:
  # Job 1: 在 GitHub 官方服务器上构建 (速度快，环境全)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify --environment china

      - name: Upload Artifact
        # 把生成的 public 文件夹打包传到 GitHub 暂存区
        uses: actions/upload-artifact@v3
        with:
          name: public-site
          path: public/
          retention-days: 1

  # Job 2: 你的国内服务器把包拉下来部署
  deploy:
    needs: build # 必须等 Job 1 完成
    runs-on: self-hosted # 【关键】这会召唤你的服务器
    steps:
      - name: Download Artifact
        # 从 GitHub 暂存区把包下载到服务器
        uses: actions/download-artifact@v3
        with:
          name: public-site
          path: temp_public/

      - name: Deploy to Nginx
        # 使用 rsync 增量同步 + 删除旧文件 (防止垃圾堆积)
        run: |
          # 这里的 /var/www/html/ 换成你实际的 Nginx 站点目录
          # 注意 temp_public 后面的斜杠 / 不能少
          rsync -av --delete temp_public/ /opt/hugo-site-notes
          
          # 部署完清理临时文件
          rm -rf temp_public/
          
          echo "部署完成！"