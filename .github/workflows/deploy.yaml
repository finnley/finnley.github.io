name: Build Cloud & Deploy Local

on:
  push:
    branches:
      - main

jobs:
  # Job 1: 在 GitHub 官方服务器上构建
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify --environment china

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: public-site
          path: public/
          retention-days: 1

  # Job 2: 你的国内服务器把包拉下来部署
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: public-site
          path: temp_public/

      - name: Deploy to Nginx
        run: |
          # 确保目录存在 (避免第一次部署报错)
          mkdir -p /opt/hugo-site-notes/
          
          # 关键修改：添加 --no-o --no-g
          # --no-o: do not preserve owner (不保留所有者)
          # --no-g: do not preserve group (不保留组)
          # 这里的 /opt/hugo-site-notes/ 是你实际的 Nginx 站点目录
          rsync -av --no-o --no-g --delete temp_public/ /opt/hugo-site-notes/
          
          echo "部署完成！"
