name: deploy-china-mainland

on:
  push:
    branches:
      - main  # 确保这里是你存放代码的分支名 (main 或 master)

jobs:
  deploy-to-china:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 【新增】设置30分钟超时，防止卡死
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果主题是 submodule，必须加这行
          fetch-depth: 0

      # 2. 安装 Hugo (使用轻量级 Action，比官方那个快)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true  # 开启扩展版 (支持 SCSS 等)

      # 3. 构建国内版 (关键步骤！！！)
      # 注意：这里加了 --environment china 参数
      # 它会强制读取 hugo.toml 里 [environments.china] 的配置（即清空广告ID）
      - name: Build China Version
        run: hugo --minify --environment china

      # 【新增】诊断步骤：查看生成的 public 目录到底有多大
      # 如果这里显示超过 50MB，且你没有大量图片，说明有异常文件
      - name: Check file size
        run: du -sh public/

      # 4. 推送到国内服务器
      - name: Deploy to Aliyun/Tencent via Rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}  # 私钥
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}         # 服务器 IP
          REMOTE_USER: ${{ secrets.REMOTE_USER }}         # 用户名 (如 root)
          SOURCE: "public/"                               # Hugo 生成的文件夹
          TARGET: "/opt/hugo-site-notes/"                 # ⚠️修改为你服务器上的实际目录
          # 关键参数配置：
          # -a: 归档模式（保留权限、时间戳等）
          # -v: 详细模式（输出传输进度，相当于 debug）
          # -z: 压缩传输（极重要！解决带宽慢的问题）
          # --delete: 删除服务器上有但本地没有的文件（保持完全一致）
          ARGS: "-avz --delete"
