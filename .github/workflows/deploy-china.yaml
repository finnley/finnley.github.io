name: .github/workflows/deploy-china.yaml

on:
  push:
    branches:
      - main  # 确保这里是你存放代码的分支名 (main 或 master)
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy-to-china:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 【新增】设置30分钟超时，防止卡死
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果主题是 submodule，必须加这行
          fetch-depth: 0

      # 2. 安装 Hugo (使用轻量级 Action，比官方那个快)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true  # 开启扩展版 (支持 SCSS 等)

      # 3. 构建国内版 (关键步骤！！！)
      # 注意：这里加了 --environment china 参数
      # 它会强制读取 hugo.toml 里 [environments.china] 的配置（即清空广告ID）
      - name: Build China Version
        run: hugo --minify --environment china

      # 4. 推送到 Gitee 中转仓库 (替换了原来的 SCP 压缩包上传)
      # 备注：这里将 public 目录下的所有静态文件推送到 Gitee 的 main 分支
      - name: Deploy to Gitee Mirror
        run: |
          # 1. 配置 SSH 私钥
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. 将 Gitee 加入可信主机 (防止第一次连接弹 Yes/No 确认导致卡死)
          ssh-keyscan -t rsa gitee.com >> ~/.ssh/known_hosts
          
          # 3. 进入构建好的静态文件目录
          cd public
          
          # 4. 初始化 Git 并提交 (这就相当于在这里建了一个新库)
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "Deploy from GitHub Actions: ${{ github.sha }}"
          
          # 5. 强制推送到 Gitee (使用 SSH 地址)
          # 注意：这里使用了 -f 强制覆盖，保证 Gitee 始终与最新构建一致
          git remote add origin git@gitee.com:finnley/hugo-site-notes.git
          git push -f origin main

