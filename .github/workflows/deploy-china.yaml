name: deploy-china-mainland

on:
  push:
    branches:
      - main  # 确保这里是你存放代码的分支名 (main 或 master)

jobs:
  deploy-to-china:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 【新增】设置30分钟超时，防止卡死
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果主题是 submodule，必须加这行
          fetch-depth: 0

      # 2. 安装 Hugo (使用轻量级 Action，比官方那个快)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true  # 开启扩展版 (支持 SCSS 等)

      # 3. 构建国内版 (关键步骤！！！)
      # 注意：这里加了 --environment china 参数
      # 它会强制读取 hugo.toml 里 [environments.china] 的配置（即清空广告ID）
      - name: Build China Version
        run: hugo --minify --environment china

      # 4. 压缩打包 (核心优化点)
      # 将 public 目录下的内容打包成 site-release.tar.gz
      - name: Compress Site
        run: |
          cd public
          tar -zcvf ../site-release.tar.gz .
          cd ..

      # 5. 【满足需求】显示文件大小
      # 这样你在日志里就能看到这次包有多大，预估传输时间
      - name: Show Package Size
        run: |
          echo "📦 ---------------------------------------------------"
          echo "📦 准备推送的压缩包大小如下："
          ls -lh site-release.tar.gz
          echo "📦 ---------------------------------------------------"

      # 4. 推送到国内服务器
      - name: Deploy to Aliyun/Tencent via Rsync
        uses: appleboy/scp-action@master
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}              # 私钥
          host: ${{ secrets.REMOTE_HOST }}                # 服务器 IP
          username: ${{ secrets.REMOTE_USER }}            # 用户名 (如 root)
          source: "site-release.tar.gz"                   # Hugo 生成的文件夹
          target: "/opt/hugo-site-notes/"                 # ⚠️修改为你服务器上的实际目录
          debug: true
