name: .github/workflows/deploy-china.yaml

on:
  push:
    branches:
      - main  # 确保这里是你存放代码的分支名 (main 或 master)
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy-to-china:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 【新增】设置30分钟超时，防止卡死
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果主题是 submodule，必须加这行
          fetch-depth: 0

      # 2. 安装 Hugo (使用轻量级 Action，比官方那个快)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true  # 开启扩展版 (支持 SCSS 等)

      # 3. 构建国内版 (关键步骤！！！)
      # 注意：这里加了 --environment china 参数
      # 它会强制读取 hugo.toml 里 [environments.china] 的配置（即清空广告ID）
      - name: Build China Version
        run: hugo --minify --environment china

      # 4. 推送到 Gitee 中转仓库 (替换了原来的 SCP 压缩包上传)
      # 备注：这里将 public 目录下的所有静态文件推送到 Gitee 的 main 分支
      - name: Deploy to Gitee Mirror
        uses: peaceiris/actions-gh-pages@v3
        with:
          # 【配置说明 1】私钥
          # 对应你在 GitHub Secrets 中配置的 GITEE_SSH_KEY
          # 该私钥对应的公钥必须已添加到 Gitee 仓库的“部署公钥”中
          deploy_key: ${{ secrets.GITEE_SSH_KEY }}

          # 【配置说明 2】Gitee 仓库地址
          # ⚠️ 请修改为你的 Gitee 用户名和仓库名 (格式: username/repo)
          external_repository: finnley/hugo-site-notes

          # 【配置说明 3】推送到 Gitee 的哪个分支
          # 通常建议和本地保持一致，或专门指定一个 branch
          publish_branch: main

          # 【配置说明 4】要推送的目录
          # Hugo 构建生成的静态文件默认在 public 目录
          publish_dir: ./public

          # 提交信息 (可选，保持和 GitHub 一致方便追溯)
          commit_message: ${{ github.event.head_commit.message }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

